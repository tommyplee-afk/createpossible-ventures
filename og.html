<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');
  * { box-sizing:border-box; margin:0; padding:0; }
  :root { --ink:#1b1b1b; --muted:#6b6b72; --pink:#c94e6e; --line:#ececec; --alt:#faf7f8; }
  html,body { width:1200px; height:630px; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; overflow:hidden; }
  .card { width:1200px; height:630px; position:relative; padding:76px 80px; display:flex; flex-direction:column; }
  .card::before { content:""; position:absolute; top:0; left:0; right:0; height:10px; background:var(--pink); }
  .glow { position:absolute; right:-160px; top:-160px; width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(201,78,110,0.12), rgba(201,78,110,0) 70%); }

  .top { display:flex; align-items:center; gap:18px; }
  .top img { height:60px; width:auto; display:block; }
  .vent { font-size:20px; font-weight:600; color:var(--muted); letter-spacing:0.18em; text-transform:uppercase; border-left:2px solid var(--line); padding-left:18px; }

  .mid { flex:1; display:flex; flex-direction:column; justify-content:center; }
  h1 { font-size:76px; font-weight:800; letter-spacing:-0.03em; line-height:1.08; max-width:1000px; }
  .script { font-family:'Caveat',cursive; color:var(--pink); font-weight:700; font-size:1.12em; }
  .sub { margin-top:26px; font-size:30px; color:var(--muted); max-width:900px; line-height:1.4; }

  .foot { display:flex; align-items:center; justify-content:space-between; }
  .url { font-size:26px; font-weight:700; color:var(--pink); letter-spacing:0.01em; }
  .tag { font-size:22px; font-weight:600; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="top">
      <img src="cplogo.png" alt="Createpossible" />
      <span class="vent">Ventures</span>
    </div>

    <div class="mid">
      <h1>Building useful tools, <span class="script">for good.</span></h1>
      <p class="sub">Tools, investments, and initiatives launched to generate revenue for Gospel impact.</p>
    </div>

    <div class="foot">
      <span class="url">createpossible.ventures</span>
      <span class="tag">a Tommy Lee project</span>
    </div>
  </div>
</body>
</html>
